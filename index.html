function chart(pts,w=320,h=120){if(pts.length<2)return `<div class="mu">—</div>`;const ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),r=mx-mn||1;

`<hr style="border-color:#262626"><b>${t("add")}</b><label>${t("ex")}</label><select id="m_ex">${X.map(x=>`<option value="${x[0]}">${esc(en(EX[x[0]]))}</option>`).join("")}</select><div class="grid"><div><label>${t("sets")}</label><input id="m_s" type="number" value="3"></div><div><label>${t("reps")}</label><input id="m_r" type="number" value="10"></div><div><label>${t("kg")}</label><input id="m_w" type="number" value="0"></div><div><label>${t("dur")}</label><input id="m_d" type="number" value="45"></div></div><br><button class="btn s" onclick="manual()">${t("save")}</button></div>`}
function manual(){const id=$("#m_ex").value,n=+$("#m_s").value||1;S.workouts.push({id:uidg(),date:calSel,time:"--:--",dur:+$("#m_d").value||0,muscles:[EX[id].m],notes:"",ex:[{id,note:"",sets:Array.from({length:n},()=>({r:+$("#m_r").value,w:+$("#m_w").value,rir:null}))}]});save(1);render()}
function progV(){const ms=S.workouts,wk=inRange(mon(),new Date()),pv=mon();pv.setDate(pv.getDate()-7);const pe=new Date(pv);pe.setDate(pe.getDate()+6);const pw=inRange(pv,pe);
const pr={};ms.forEach(w=>w.ex.forEach(e=>e.sets.forEach(s=>{if(!pr[e.id]||s.w>pr[e.id])pr[e.id]=s.w})));
const pts=[];[...ms].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>w.ex.filter(e=>e.id===pex).forEach(e=>pts.push([w.date,Math.max(...e.sets.map(s=>s.w))])));
const f=freq(),least=MU.filter(m=>m!=="cardio").sort((a,b)=>f[a]-f[b]).slice(0,3);
return `<h2>${t("progress")}</h2><div class="grid"><div class="card"><div class="mu">${t("week")}</div><b class="big">${wk.length}</b><div class="mu">${t("vs")}: ${pw.length}</div></div><div class="card"><div class="mu">${t("time")}</div><b class="big">${ms.reduce((a,w)=>a+(+w.dur||0),0)}</b> <span class="mu">${t("minutes")}</span></div></div>
<div class="card"><h3>${t("pr")}</h3>${Object.keys(pr).length?Object.entries(pr).map(([k,v])=>`<div class="row sp"><span>${esc(en(EX[k]||{n:[k,k]}))}</span><b>${v} kg</b></div>`).join(""):`<div class="mu">${t("none")}</div>`}</div>
<div class="card"><select onchange="pex=this.value;render()">${X.map(x=>`<option value="${x[0]}" ${pex===x[0]?"selected":""}>${esc(en(EX[x[0]]))}</option>`).join("")}</select>${chart(pts)}</div>
<div class="card"><h3>${t("bw")}</h3>${chart(S.bw.map(b=>[b.date,b.kg]))}<div class="row" style="margin-top:8px"><input id="bwi" type="number" step="0.1"><button class="btn s" onclick="const v=+$('#bwi').value;if(v){S.bw.push({date:today(),kg:v});save(1);render()}">${t("bwAdd")}</button></div></div>
<div class="card"><h3>${t("freq")}</h3>${MU.map(m=>`<div class="row sp"><span>${t(m)}</span><b>${f[m]}</b></div>`).join("")}<div class="mu" style="margin-top:6px">${t("least")}: <b class="red">${least.map(m=>t(m)).join(", ")}</b></div></div>`}
let pk=null;function pop(b){b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}
document.addEventListener("click",e=>{const b=e.target.closest(".btn,.chip,.cat,.ok,nav button,.cal div");if(!b)return;const sel=[".btn",".chip",".cat",".ok"].find(c=>b.matches(c))||(b.matches("nav button")?"nav button":".cal div");pk={sel,i:[...document.querySelectorAll(sel)].indexOf(b)};pop(b)},true);
const _r=render;render=function(){_r();if(pk){const l=document.querySelectorAll(pk.sel)[pk.i];if(l)pop(l);pk=null}};
boot();
</script></body></html>
