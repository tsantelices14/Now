<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A0A0C">
    <title>NOW | PLANIFICA. EJECUTA. DOMINA.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* NOW Core Palette */
            --bg-deep-black: #0A0A0C;
            --txt-pure-white: #F4F4F5;
            --accent-electric-blue: #00F0FF;
            --accent-dim: rgba(0, 240, 255, 0.15);
            --steel-grey: #27272A;
            --card-bg: #141417;
            --alert-red: #FF2A2A;
            --font-main: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep-black);
            color: var(--txt-pure-white);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-deep-black);
            position: relative;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--txt-pure-white);
            line-height: 1;
            margin-bottom: 8px;
        }

        .brand-title span {
            color: var(--accent-electric-blue);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-electric-blue);
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--steel-grey);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #A1A1AA;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--steel-grey);
            border: 1px solid transparent;
            color: var(--txt-pure-white);
            font-family: var(--font-main);
            font-size: 0.95rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-electric-blue);
            box-shadow: 0 0 10px var(--accent-dim);
        }

        button {
            width: 100%;
            padding: 14px;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-primary {
            background-color: var(--accent-electric-blue);
            color: var(--bg-deep-black);
        }

        .btn-primary:hover {
            background-color: #33f3ff;
            box-shadow: 0 0 15px var(--accent-dim);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--steel-grey);
            color: var(--txt-pure-white);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background-color: var(--steel-grey);
        }

        .notice-box {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--accent-electric-blue);
            border-radius: 6px;
            padding: 12px;
            font-size: 0.8rem;
            color: var(--txt-pure-white);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .error-text {
            color: var(--alert-red);
            font-size: 0.8rem;
            margin-top: 8px;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Renderizado dinámico -->
    </div>

    <script>
        // Supabase Config
        const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
        
        let sb = null;
        if (SUPABASE_URL !== "YOUR_SUPABASE_URL_HERE" && typeof supabase !== 'undefined') {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const app = document.getElementById('app');

        function renderAuthView() {
            const isConfigured = sb !== null;
            app.innerHTML = `
                <div class="brand-header">
                    <h1 class="brand-title">N<span>O</span>W</h1>
                    <p class="brand-subtitle">Planifica. Ejecuta. Domina.</p>
                </div>
                
                <div class="card">
                    ${!isConfigured ? `
                        <div class="notice-box">
                            ⚡ <strong>Modo Vista Previa</strong><br>
                            La nueva interfaz visual está activa. Para conectar tu base de datos, reemplaza <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> en este archivo.
                        </div>
                    ` : ''}

                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="email" placeholder="atleta@now.com">
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••">
                    </div>

                    <span id="auth-error" class="error-text"></span>

                    <button class="btn-primary" onclick="handleAuth('login')">Iniciar Sesión</button>
                    <button class="btn-secondary" onclick="handleAuth('signup')">Registrarse</button>
                </div>
            `;
        }

        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errSpan = document.getElementById('auth-error');
            errSpan.innerText = '';

            if (!sb) {
                errSpan.innerText = 'Por favor configura tus claves de Supabase en el archivo.';
                return;
            }

            if (!email || !password) {
                errSpan.innerText = 'Ingresa tu correo y contraseña.';
                return;
            }

            try {
                const res = type === 'login' 
                    ? await sb.auth.signInWithPassword({ email, password })
                    : await sb.auth.signUp({ email, password });
                
                if (res.error) throw res.error;
            } catch (err) {
                errSpan.innerText = err.message;
            }
        }

        document.addEventListener('DOMContentLoaded', renderAuthView);
    </script>
</body>
</html>
